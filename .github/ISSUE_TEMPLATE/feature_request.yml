name: Feature request
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提需求！如果建议和“数据底座 / 估值 / Agent 协作”相关，请尽量说明它如何增强可核对性，而不只是增加对话效果。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      placeholder: 现在缺少什么能力？现有流程哪里痛？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的建议方案
      placeholder: 希望系统怎么表现？如果有接口/交互草图也可以写
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 主要影响模块
      multiple: true
      options:
        - 数据底座 / 爬虫
        - 财务分析
        - 估值模型
        - Agent / Pipeline
        - 前端体验
        - 报告输出
        - 工程化 / 测试 / CI
        - 文档
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: 为什么这对项目有价值
      description: 例如提升数据质量、降低幻觉、增强可解释性、改善开发体验
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 参考实现
      placeholder: 有没有现成库、论文、开源项目可以参考？
  - type: checkboxes
    id: willingness
    attributes:
      label: 你是否愿意参与实现
      options:
        - label: 我可以提交 PR
        - label: 我可以补充设计细节或测试样例
        - label: 我暂时只能提建议
