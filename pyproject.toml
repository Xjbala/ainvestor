[project]
name = "ainvestor"
version = "0.1.0"
description = "AI Investment Analysis System with Multi-Agent Architecture"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0.0",
    "agentscope>=1.0.13,<2",
    "pyyaml>=6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "websockets>=14.0",
    "pydantic>=2.0.0",
    # Database (MySQL + SQLAlchemy)
    "sqlalchemy>=2.0.0",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.20.0", # Keep for migration/fallback
    "greenlet>=3.0.0",    # Required by SQLAlchemy async
    # Authentication
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    # Utilities
    "email-validator>=2.0.0",
    "httpx>=0.27.0",
    "pymysql>=1.1.2",
    "beautifulsoup4>=4.14.3",
]

[project.scripts]
ainvestor = "backend.server:main"
