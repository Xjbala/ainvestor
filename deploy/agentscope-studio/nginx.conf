# Include these locations in the HTTPS server block that serves AI Investor.
#
# This template is intentionally pinned to @agentscope/studio 1.0.9. That
# release assumes it owns the origin root, so sub_filter rewrites its static
# assets, browser routes, tRPC API and Socket.IO transport below.
#
# Confirm the Nginx build includes ngx_http_sub_module before using this file:
# nginx -V 2>&1 | grep -- --with-http_sub_module

location = /agent-studio {
    return 301 /agent-studio/;
}

# Studio's live UI update channel.
location /agent-studio/socket.io/ {
    auth_basic "AgentScope Studio";
    auth_basic_user_file /etc/nginx/.htpasswd-agent-studio;
    proxy_pass http://127.0.0.1:3000/socket.io/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
    proxy_send_timeout 3600;
}

# Studio's browser-side tRPC client calls this root-relative endpoint.
location /agent-studio/trpc {
    auth_basic "AgentScope Studio";
    auth_basic_user_file /etc/nginx/.htpasswd-agent-studio;
    proxy_pass http://127.0.0.1:3000/trpc;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# AgentScope Studio is a developer diagnostic tool and does not provide
# production-grade access control. Keep these credentials in place, or replace
# the same protection in all three Studio locations with VPN, SSO, or an IP
# allowlist. Do not leave the tRPC or Socket.IO locations unprotected.
location /agent-studio/ {
    auth_basic "AgentScope Studio";
    auth_basic_user_file /etc/nginx/.htpasswd-agent-studio;
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Nginx can only substitute uncompressed upstream bodies.
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript text/javascript;
    sub_filter 'href="/' 'href="/agent-studio/';
    sub_filter 'src="/' 'src="/agent-studio/';
    sub_filter 'url:"/trpc"' 'url:"/agent-studio/trpc"';
    sub_filter '"/socket.io"' '"/agent-studio/socket.io"';
    sub_filter 'jsxRuntimeExports.jsx(BrowserRouter,{children:' 'jsxRuntimeExports.jsx(BrowserRouter,{basename:"/agent-studio",children:';
}
